name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  corpus-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install --upgrade pip pytest
      - name: Validate corpus manifest
        run: python -m src.validacion.corpus_manifest
      - name: Run tests
        run: python -m pytest -q
